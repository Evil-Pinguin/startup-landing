<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel = "stylesheet" href="css/style.css">
</head>

            <a href="#" class="logo">CoffeeCo</a>

            <!--Навигация (Блок)-->

                    <!-- Кнопка с модификатором primary -->
                    <button class="button button_primary">Заказать сейчас</button>

            </div>
        </section>

    <footer>

    </footer>
